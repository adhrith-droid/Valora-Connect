<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MW819QM3ZX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-MW819QM3ZX');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORA | Analytics</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        if (sessionStorage.getItem('valora_admin_auth') !== 'true' && localStorage.getItem('valora_admin_auth') !== 'true') {
            window.location.replace('/admin/login.html');
        }
    </script>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <aside id="sidebar" class="sidebar glass">
        <div id="sidebar-toggle" class="sidebar-toggle">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </div>
        <div class="p-8 mb-4 flex items-center">
            <h1 class="text-2xl font-black tracking-tighter text-white sidebar-header-text">VALORA <span class="text-red-500">ADMIN</span></h1>
            <h1 class="text-2xl font-black tracking-tighter text-red-500 hidden sidebar-collapsed-text">V</h1>
        </div>
        
        <nav class="space-y-2">
            <a href="/admin" class="nav-link">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Dashboard</span>
            </a>
            <a href="/admin/reports-page" class="nav-link">
                <i data-lucide="flag" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Reports</span>
            </a>
            <a href="/admin/banned-page" class="nav-link">
                <i data-lucide="user-x" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Banned Users</span>
            </a>
            <a href="/admin/analytics-page" class="nav-link active">
                <i data-lucide="activity" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Analytics</span>
            </a>
            <div class="pt-8 mt-8 border-t border-white/5">
                <a href="/admin/logout" onclick="adminLogout(event)" class="nav-link text-red-400 hover:text-red-300">
                    <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                    <span class="nav-text">Logout</span>
                </a>
            </div>
        </nav>
    </aside>

    <main id="main-content" class="main-content">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <button id="mobile-toggle" class="lg:hidden p-2 bg-white/5 rounded-lg border border-white/5">
                    <i data-lucide="menu" class="w-6 h-6 text-white"></i>
                </button>
                <div>
                    <h2 class="text-3xl font-black text-white tracking-tight">Platform Analytics</h2>
                    <p class="text-gray-400 text-sm mt-1">Detailed reporting and usage trends</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="fetchAnalytics()" class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5 hover:bg-white/10 transition-colors">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-gray-400"></i>
                    <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Refresh</span>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-10">
            <div class="glass p-8 rounded-[1.5rem] animate-in">
                <h3 class="text-xl font-bold text-white mb-6">Reports by Reason</h3>
                <div class="chart-container">
                    <canvas id="reasonChart"></canvas>
                </div>
            </div>
            <div class="glass p-8 rounded-[1.5rem] animate-in" style="animation-delay: 0.1s;">
                <h3 class="text-xl font-bold text-white mb-6">Reports Trend (Last 7 Days)</h3>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="admin.js"></script>
    <script>
        let reasonChart = null;
        let trendChart = null;

        async function fetchAnalytics() {
            try {
                const response = await fetch('/admin/api/analytics');
                if (response.ok) {
                    const data = await response.json();
                    updateReasonChart(data.reportsByReason);
                    updateTrendChart(data.reportsByDay);
                }
            } catch (err) {
                console.error('Analytics fetch error:', err);
            }
        }

        function updateReasonChart(data) {
            const ctx = document.getElementById('reasonChart').getContext('2d');
            const labels = data.map(d => d._id);
            const counts = data.map(d => d.count);

            if (reasonChart) reasonChart.destroy();
            
            reasonChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: counts,
                        backgroundColor: [
                            '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'
                        ],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#9ca3af', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateTrendChart(data) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const labels = data.map(d => d._id);
            const counts = data.map(d => d.count);

            if (trendChart) trendChart.destroy();
            
            trendChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Reports',
                        data: counts,
                        backgroundColor: '#ef4444',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#6b7280' } },
                        y: { 
                            beginAtZero: true, 
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#6b7280', stepSize: 1 }
                        }
                    }
                }
            });
        }

        fetchAnalytics();
    </script>
</body>
</html>
