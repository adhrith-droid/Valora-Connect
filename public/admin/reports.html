<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORA | Reports Management</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <aside id="sidebar" class="sidebar glass">
        <div id="sidebar-toggle" class="sidebar-toggle">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </div>
        <div class="p-8 mb-4 flex items-center">
            <h1 class="text-2xl font-black tracking-tighter text-white sidebar-header-text">VALORA <span class="text-red-500">ADMIN</span></h1>
            <h1 class="text-2xl font-black tracking-tighter text-red-500 hidden sidebar-collapsed-text">V</h1>
        </div>
        
        <nav class="space-y-2">
            <a href="/admin" class="nav-link">
                <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Dashboard</span>
            </a>
            <a href="/admin/reports-page" class="nav-link active">
                <i data-lucide="flag" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Reports</span>
            </a>
            <a href="/admin/banned-page" class="nav-link">
                <i data-lucide="user-x" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Banned Users</span>
            </a>
            <a href="/admin/analytics-page" class="nav-link">
                <i data-lucide="activity" class="w-5 h-5 mr-3"></i>
                <span class="nav-text">Analytics</span>
            </a>
            <div class="pt-8 mt-8 border-t border-white/5">
                <a href="/admin/logout" class="nav-link text-red-400 hover:text-red-300">
                    <i data-lucide="log-out" class="w-5 h-5 mr-3"></i>
                    <span class="nav-text">Logout</span>
                </a>
            </div>
        </nav>
    </aside>

    <main id="main-content" class="main-content">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <button id="mobile-toggle" class="lg:hidden p-2 bg-white/5 rounded-lg border border-white/5">
                    <i data-lucide="menu" class="w-6 h-6 text-white"></i>
                </button>
                <div>
                    <h2 class="text-3xl font-black text-white tracking-tight">Reports Management</h2>
                    <p class="text-gray-400 text-sm mt-1">Review and action user reports</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="fetchAllReports()" class="flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5 hover:bg-white/10 transition-colors">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-gray-400"></i>
                    <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Refresh</span>
                </button>
            </div>
        </header>

        <div class="glass p-8 rounded-[1.5rem] animate-in">
            <div class="table-container">
                <table id="reports-table">
                    <thead>
                        <tr>
                            <th>Reporter</th>
                            <th>Reason</th>
                            <th>Message</th>
                            <th>Reported User</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="all-reports-body">
                        <!-- Content loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="admin.js"></script>
</body>
</html>
