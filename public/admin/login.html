<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORA | Admin Login</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="icon" href="https://cloud.ryntly.in/favicon.png" type="image/png">
</head>
<body>
    <div class="login-container">
        <div class="login-card glass">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-black tracking-tighter text-white mb-2">VALORA <span class="text-red-500">ADMIN</span></h1>
                <p class="text-gray-400 text-sm">Secure access to management panel</p>
            </div>
            
            <form id="login-form" class="space-y-6" action="/admin/login" method="POST">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Username</label>
                    <input type="text" name="username" id="username" placeholder="Admin username" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-500 mb-2">Password</label>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div id="login-error" class="text-red-500 text-xs text-center hidden">Invalid username or password</div>
                
                <button type="submit" class="btn-primary">Login to Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        // Check for error query param if needed, or just let the server handle it
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            document.getElementById('login-error').classList.remove('hidden');
        }
    </script>
</body>
</html>
