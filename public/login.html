<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In — VALORA</title>
    <meta name="description" content="Sign in to VALORA with your Google account to start video chatting instantly.">
    <link rel="canonical" href="https://ryntly.in/login">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/valora-tokens.css?v=3.2">
    <style>
        body {
            background-color: var(--vl-bg-base);
            color: var(--vl-text-primary);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
        }

        /* Ambient background glow orbs */
        .bg-glow-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }

        .orb-1 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.4) 0%, transparent 70%);
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            animation: floatGlow 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(185, 28, 28, 0.25) 0%, transparent 70%);
            bottom: 5%;
            right: 10%;
        }

        @keyframes floatGlow {
            0% { transform: translateX(-50%) translateY(0) scale(1); }
            100% { transform: translateX(-50%) translateY(30px) scale(1.08); }
        }

        /* Top Header */
        .login-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--vl-header-height, 72px);
            background: var(--vl-bg-glass, rgba(10, 10, 14, 0.85));
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--vl-border-subtle, rgba(255, 255, 255, 0.08));
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .login-header-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Main Container */
        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 48px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(180deg, rgba(26, 26, 34, 0.85) 0%, rgba(16, 16, 22, 0.95) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(220, 38, 38, 0.1);
            text-align: center;
            box-sizing: border-box;
            position: relative;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-title {
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
            margin: 0 0 10px;
            line-height: 1.2;
        }

        .login-subtitle {
            font-size: 0.95rem;
            color: var(--vl-text-secondary, #cbd5e1);
            line-height: 1.55;
            margin: 0 auto 26px;
            max-width: 320px;
        }

        /* Error/Status Banner */
        .login-alert {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.875rem;
            line-height: 1.45;
            text-align: left;
        }

        .login-alert-error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.35);
            color: #fecaca;
        }

        .login-alert-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #bfdbfe;
        }

        /* Continue with Google Primary Button */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            height: 52px;
            background: #ffffff;
            color: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), 0 0 20px rgba(255, 255, 255, 0.12);
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background-color 0.2s ease;
            box-sizing: border-box;
            user-select: none;
        }

        .btn-google:hover {
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 24px rgba(220, 38, 38, 0.25);
        }

        .btn-google:active {
            transform: translateY(0) scale(0.98);
        }

        .google-icon-svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .login-footer-legal {
            font-size: 0.8125rem;
            color: #64748b;
            line-height: 1.5;
            margin-top: 24px;
        }

        .login-footer-legal a {
            color: var(--vl-text-secondary, #cbd5e1);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }

        .login-footer-legal a:hover {
            color: #ffffff;
        }

        /* Logged in state box */
        .logged-in-box {
            display: none;
            padding: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .user-avatar-img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid var(--vl-accent, #dc2626);
            margin-bottom: 12px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-glow-layer">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <!-- Top Header -->
    <header class="login-header">
        <div class="login-header-container">
            <a href="/" class="vl-wordmark" aria-label="VALORA Home">
                <span>VALORA</span><span class="vl-wordmark-dot"></span>
            </a>
            <a href="/" class="vl-btn vl-btn-secondary" style="padding: 8px 16px; font-size: 0.875rem;">
                Back to Home
            </a>
        </div>
    </header>

    <!-- Main Card -->
    <main class="login-main">
        <div class="login-card" id="login-card">

            <h1 class="login-title">Welcome to VALORA</h1>
            <p class="login-subtitle">Sign in to connect with people around the world in real-time video chat.</p>

            <!-- Alert notification box -->
            <div id="login-alert" class="login-alert">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <div id="login-alert-text"></div>
            </div>

            <!-- Already Authenticated Profile State -->
            <div id="logged-in-container" class="logged-in-box">
                <img id="logged-user-avatar" class="user-avatar-img" src="" alt="Avatar" referrerpolicy="no-referrer">
                <div style="font-weight: 700; font-size: 1.1rem; color: #ffffff;" id="logged-user-name"></div>
                <div style="font-size: 0.875rem; color: #94a3b8; margin-bottom: 16px;" id="logged-user-email"></div>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <a href="/" class="vl-btn vl-btn-primary" style="flex: 1; padding: 10px 16px; font-size: 0.875rem;">Go to Home</a>
                    <a href="/chat" class="vl-btn vl-btn-secondary" style="flex: 1; padding: 10px 16px; font-size: 0.875rem;">Start Video Chat</a>
                </div>
                <div style="margin-top: 14px;">
                    <a href="/api/auth/logout" style="color: #ef4444; font-size: 0.8125rem; text-decoration: underline;">Log out</a>
                </div>
            </div>

            <!-- Primary OAuth CTA: Continue with Google -->
            <div id="oauth-action-container">
                <a href="/api/auth/google" class="btn-google" id="btn-google-login">
                    <svg class="google-icon-svg" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    <span>Continue with Google</span>
                </a>
            </div>

            <!-- Terms & Privacy Footnote -->
            <p class="login-footer-legal">
                By continuing, you agree to VALORA's <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>.
            </p>
        </div>
    </main>

    <script>
        // Check for error query params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const alertBox = document.getElementById('login-alert');
        const alertText = document.getElementById('login-alert-text');

        if (error) {
            alertBox.style.display = 'flex';
            alertBox.className = 'login-alert login-alert-error';

            if (error === 'missing_config') {
                alertText.innerHTML = '<strong>Configuration Required:</strong> Google OAuth credentials (<code>GOOGLE_CLIENT_ID</code> & <code>GOOGLE_CLIENT_SECRET</code>) must be configured in environment variables.';
            } else if (error === 'access_denied') {
                alertText.textContent = 'Google sign-in was cancelled. Please try again when you are ready.';
            } else if (error === 'token_exchange_failed') {
                alertText.textContent = 'Failed to verify authentication with Google. Please check your OAuth Client Secret and authorized redirect URI.';
            } else {
                alertText.textContent = 'Sign-in error: ' + error + '. Please try again.';
            }
        }

        // Check if user is already authenticated
        fetch('/api/auth/user')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated && data.user) {
                    const loggedBox = document.getElementById('logged-in-container');
                    const oauthBtn = document.getElementById('oauth-action-container');
                    const userAvatar = document.getElementById('logged-user-avatar');
                    const userName = document.getElementById('logged-user-name');
                    const userEmail = document.getElementById('logged-user-email');

                    loggedBox.style.display = 'block';
                    oauthBtn.style.display = 'none';

                    userName.textContent = data.user.name || 'VALORA User';
                    userEmail.textContent = data.user.email || '';
                    userAvatar.src = data.user.avatar_url || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="%2364748b"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>';
                }
            })
            .catch(err => console.warn('Auth check error:', err));
    </script>
</body>
</html>
